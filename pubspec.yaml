name: fanhub_archive
description: "FanHub Archive - 유튜버와 팬을 잇는 팬덤 아카이브 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태 관리
  provider: 6.1.5+1

  # 로컬 저장소 (데모/오프라인 모드)
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # 디자인 / 유틸
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1

  # Firebase (설정 파일 추가 시 자동 활성화)
  firebase_core: 3.6.0
  cloud_firestore: 5.4.3
  firebase_auth: 5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
